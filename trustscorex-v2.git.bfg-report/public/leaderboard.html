<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TrustScoreX — Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/common.css">
</head>
<body>
  <div class="nav">
    <div class="nav-brand"><span class="mark">TX</span> TrustScoreX</div>
    <div class="nav-links">
      <a href="/index.html">Register</a>
      <a href="/login.html">Log In</a>
      <a href="/dashboard.html">Dashboard</a>
      <a href="/leaderboard.html" class="active">Leaderboard</a>
      <a href="/risk.html">Risk Monitor</a>
      <a href="/admin.html">Admin</a>
    </div>
  </div>

  <div class="wrap">
    <p class="eyebrow">Ranked</p>
    <h1 class="title">Leaderboard</h1>
    <p class="lede">Students ranked by trust score, highest first.</p>

    <div class="card">
      <table>
        <thead><tr><th>#</th><th>Seal</th><th>Name</th><th>Score</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script>
    fetch('/api/leaderboard').then(r => r.json()).then(students => {
      document.getElementById('rows').innerHTML = students.map((s, i) => `
        <tr>
          <td style="font-family:var(--font-mono);">${i + 1}</td>
          <td><div class="seal seal-sm status-${s.status}"><div class="score">${s.trustScore}</div></div></td>
          <td>${s.name}</td>
          <td style="font-family:var(--font-mono);">${s.trustScore}</td>
        </tr>
      `).join('') || '<tr><td colspan="4">No students yet.</td></tr>';
    });
  </script>
</body>
</html>
